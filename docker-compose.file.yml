version: "3.9"

services:
  app:
    build: .
    container_name: klingelnberg-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      StorageMode: FILE
      DataFilePath: Data/matrix.txt
    volumes:
      - ./Data:/app/Data
